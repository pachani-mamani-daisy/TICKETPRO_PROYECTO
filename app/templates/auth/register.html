{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-4">
        <div class="card shadow-lg border-0" style="background: rgba(198, 221, 245, 0.948); border-radius: 20px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="display-4 text-primary mb-2"><i class="fas fa-ticket-alt"></i></div>
                    <h2 class="fw-bold text-dark">ÚNETE A TICKETPRO</h2>
                    <p class="text-muted small">Regístrate para reservar tus películas favoritas</p>
                </div>

                <form method="POST">
                    <!-- Campo Usuario -->
                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold small text-uppercase">Elige un Usuario</label>
                        <input type="text" name="username" class="form-control form-control-lg" placeholder="Ej: Daisy_P" required style="border-radius: 12px;">
                    </div>
                    
                    <!-- Campo Contraseña -->
                    <div class="mb-4 text-start">
                        <label class="form-label fw-bold small text-uppercase">Contraseña Segura</label>
                        <input type="password" name="password" class="form-control form-control-lg" placeholder="Mínimo 6 caracteres" required style="border-radius: 12px;">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow">
                        CREAR MI CUENTA
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">¿Ya eres parte del cine?</p>
                    <a href="{{ url_for('auth.login') }}" class="fw-bold text-decoration-none text-primary">Volver al Ingreso</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
