{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-4">
        <div class="card shadow-lg border-0" style="background: rgba(198, 219, 246, 0.9); border-radius: 20px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="display-4 text-primary mb-2"><i class="fas fa-user-lock"></i></div>
                    <h2 class="fw-bold text-dark">BIENVENIDO</h2>
                    <p class="text-muted small">Ingresa tus credenciales para continuar</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase">Nombre de Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-user"></i></span>
                            <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="usuario" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-uppercase">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-key"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow">
                        INICIAR SESIÓN
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">¿Aún no tienes cuenta?</p>
                    <a href="{{ url_for('auth.register') }}" class="fw-bold text-decoration-none">Crea una cuenta aquí</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
