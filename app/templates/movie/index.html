{% extends 'base.html' %}
{% block content %}
<div class="py-4">
    <h2 class="fw-bolder mb-4 text-dark display-6"><i class="fas fa-film me-2"></i>Cartelera: Julio 2026</h2>
    
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for p in peliculas %}
        <div class="col">
            <div class="card h-100 shadow border-0 movie-card" 
                style="border-radius: 25px; overflow: hidden; min-height: 450px; 
                        background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.9)), 
                        url('/static/pelis/{{ p.imagen_url }}');
                        background-size: cover; background-position: center; position: relative;">

                <div class="card-body d-flex flex-column justify-content-end p-4 text-white">
                    <span class="badge bg-primary mb-2 w-25">{{ p.genero.nombre }}</span>
                    <h3 class="fw-bold mb-1" style="text-shadow: 2px 2px 8px rgba(0,0,0,0.8);">{{ p.titulo }}</h3>
                    <p class="small opacity-90 mb-3" style="text-shadow: 1px 1px 4px rgba(0,0,0,0.8);">
                        {{ p.sinopsis }}
                    </p>
                    <div class="d-flex justify-content-between align-items-center">
                        <small><i class="far fa-clock"></i> {{ p.duracion }} min</small>
                        <a href="{{ url_for('booking.buy_ticket', peli_id=p.id) }}" 
                           class="btn btn-primary px-4 fw-bold shadow">
                            RESERVAR
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
